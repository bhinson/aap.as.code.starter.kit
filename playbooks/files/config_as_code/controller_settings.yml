---
# Subscription and analytics credentials come from the optional vault
# (see playbooks/files/vault_example.yml). Without a vault the controller
# settings are left as they are.
controller_settings: "{{ starter_kit_controller_settings if analytics_client_id is defined else [] }}"

starter_kit_controller_settings:
  - settings:
      REDHAT_USERNAME: "{{ analytics_client_id }}"
      REDHAT_PASSWORD: "{{ analytics_client_secret }}"
      INSIGHTS_TRACKING_STATE: true
      SUBSCRIPTIONS_CLIENT_ID: "{{ subscripions_client_id }}"
      SUBSCRIPTIONS_CLIENT_SECRET: "{{ subscriptions_client_secret }}"
