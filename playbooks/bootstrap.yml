---
# Automates the README "Getting started" steps against a fresh AAP 2.7, using the
# private automation hub built into AAP for collections.
#
#   ansible-playbook playbooks/bootstrap.yml -e @secrets.yml
#
# secrets.yml (git-ignored) needs:
#   aap_hostname (with https://), aap_username, aap_password, aap_validate_certs - an AAP admin
#   starter_kit_svc_username, starter_kit_svc_password             - service account to create
#   starter_kit_scm_url                                            - git URL of this repo
# Optional: starter_kit_remote_vault (URL of a vault, see playbooks/files/vault_example.yml)
- name: Bootstrap the AAP starter kit
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    starter_kit_organization: Default
    starter_kit_scm_branch: main
    starter_kit_inventory: Demo Inventory
    starter_kit_execution_environment: Default execution environment
    starter_kit_credential: Starter Kit - AAP Credential
    starter_kit_galaxy_token_description: Starter Kit - Galaxy
    starter_kit_hub_repos:
      - name: Automation Hub - certified
        repo: rh-certified
      - name: Automation Hub - validated
        repo: validated
  module_defaults:
    group/ansible.platform.gateway: &aap_auth
      aap_hostname: "{{ aap_hostname }}"
      aap_username: "{{ aap_username }}"
      aap_password: "{{ aap_password }}"
      aap_validate_certs: "{{ aap_validate_certs }}"
    group/ansible.controller.controller: *aap_auth

  tasks:
    - name: Create the service account
      ansible.platform.user:
        username: "{{ starter_kit_svc_username }}"
        password: "{{ starter_kit_svc_password }}"
        first_name: Starter Kit
        last_name: Service Account
        is_superuser: true
        state: present
      no_log: true

    # On AAP 2.7 the gateway rejects hub API tokens from ansible-galaxy but accepts a gateway
    # API token, so project syncs use a read-scoped token owned by the service account.
    # Each run replaces the previous one.
    - name: Find the service account's previous Galaxy token
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/gateway/v1/tokens/?description={{ starter_kit_galaxy_token_description | urlencode }}"
        url_username: "{{ starter_kit_svc_username }}"
        url_password: "{{ starter_kit_svc_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: starter_kit_old_tokens

    - name: Create a read-scoped gateway token for the Galaxy credentials
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/gateway/v1/tokens/"
        method: POST
        body_format: json
        body:
          description: "{{ starter_kit_galaxy_token_description }}"
          scope: read
        status_code: 201
        url_username: "{{ starter_kit_svc_username }}"
        url_password: "{{ starter_kit_svc_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: starter_kit_galaxy_token
      no_log: true

    - name: Create the Galaxy credentials for the private automation hub
      ansible.controller.credential:
        name: "{{ item.name }}"
        organization: "{{ starter_kit_organization }}"
        credential_type: Ansible Galaxy/Automation Hub API Token
        inputs:
          url: "{{ aap_hostname }}/api/galaxy/content/{{ item.repo }}/"
          token: "{{ starter_kit_galaxy_token.json.token }}"
      loop: "{{ starter_kit_hub_repos }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Delete the previous Galaxy tokens
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/gateway/v1/tokens/{{ item.id }}/"
        method: DELETE
        status_code: 204
        url_username: "{{ starter_kit_svc_username }}"
        url_password: "{{ starter_kit_svc_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      loop: "{{ starter_kit_old_tokens.json.results }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Read the organization's current Galaxy credentials
      ansible.builtin.set_fact:
        starter_kit_existing_galaxy: >-
          {{ query('ansible.controller.controller_api', 'organizations/' ~ starter_kit_org.id ~ '/galaxy_credentials/',
                   host=aap_hostname, username=aap_username, password=aap_password, verify_ssl=aap_validate_certs)
             | map(attribute='name') | list }}
      vars:
        starter_kit_org: >-
          {{ lookup('ansible.controller.controller_api', 'organizations', query_params={'name': starter_kit_organization}, expect_one=true,
                    host=aap_hostname, username=aap_username, password=aap_password, verify_ssl=aap_validate_certs) }}

    # Private hub first, then whatever the organization already used.
    - name: Relate the Galaxy credentials to the organization
      ansible.controller.organization:
        name: "{{ starter_kit_organization }}"
        galaxy_credentials: >-
          {{ starter_kit_hub_repos | map(attribute='name') | list
             + (starter_kit_existing_galaxy | difference(starter_kit_hub_repos | map(attribute='name'))) }}

    - name: Create the AAP credential the job template uses
      ansible.controller.credential:
        name: "{{ starter_kit_credential }}"
        organization: "{{ starter_kit_organization }}"
        credential_type: Red Hat Ansible Automation Platform
        inputs:
          host: "{{ aap_hostname }}"
          username: "{{ starter_kit_svc_username }}"
          password: "{{ starter_kit_svc_password }}"
          verify_ssl: "{{ aap_validate_certs }}"
      no_log: true

    - name: Create the project
      ansible.controller.project:
        name: aap.as.code.starter.kit
        organization: "{{ starter_kit_organization }}"
        scm_type: git
        scm_url: "{{ starter_kit_scm_url }}"
        scm_branch: "{{ starter_kit_scm_branch }}"
        scm_update_on_launch: true
        update_project: true
        default_environment: "{{ starter_kit_execution_environment }}"
        wait: true

    - name: Create the job template
      ansible.controller.job_template:
        name: Setup - AAP - CAC
        organization: "{{ starter_kit_organization }}"
        project: aap.as.code.starter.kit
        playbook: playbooks/main.yml
        inventory: "{{ starter_kit_inventory }}"
        execution_environment: "{{ starter_kit_execution_environment }}"
        credentials:
          - "{{ starter_kit_credential }}"
        extra_vars: >-
          {{ {'my_remote_vault': starter_kit_remote_vault} if starter_kit_remote_vault is defined else {} }}
